
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سودوکوی کلاس اول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌈 سودوکوی کوچولوها</h1>

    <!-- جدول سودوکو -->
    <div id="board" class="board"></div>

    <!-- شکل‌ها -->
    <div class="pieces">
        <button class="piece">🍎</button>
        <button class="piece">🐱</button>
        <button class="piece">⭐</button>
        <button class="piece">🚗</button>
    </div>

    <!-- دکمه‌ها -->
    <div class="buttons">
        <button id="check">✅ بررسی پاسخ</button>
        <button id="newGame">🎲 جدول جدید</button>
    </div>

    <h2 id="message"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
