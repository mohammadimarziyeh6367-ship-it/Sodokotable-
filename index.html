<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="description"
        content="بازی آموزشی جدول شگفت‌انگیز برای دانش‌آموزان کلاس اول">

    <meta
        name="theme-color"
        content="#8ed8ff">

    <title>🧩 جدول شگفت‌انگیز | بازی آموزشی کلاس اول</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==================================================
         صفحه شروع
    =================================================== -->

    <main class="welcome" id="welcomePage">

        <section class="card">

            <!-- عکس معلم -->

            <img
                src="IMG_3330.jpeg"
                class="teacher"
                alt="تصویر معلم">


            <!-- عنوان بازی -->

            <h1>
                🧩 جدول شگفت‌انگیز
            </h1>


            <p>
                بازی آموزشی کلاس اول دبستان
            </p>


            <h2>
                نام زیبایت را وارد کن 🥰
            </h2>


            <!-- نام دانش‌آموز -->

            <input
                id="studentName"
                type="text"
                placeholder="نام دانش‌آموز"
                aria-label="نام دانش‌آموز"
                autocomplete="name"
                maxlength="30">


            <!-- شروع بازی -->

            <button
                id="startGame"
                type="button">

                🎮 شروع بازی

            </button>

        </section>

    </main>



    <!-- ==================================================
         صفحه بازی
    =================================================== -->

    <main
        id="game"
        aria-label="بازی جدول شگفت‌انگیز">


        <!-- عنوان بازی -->

        <header class="game-header">

            <h1>
                🧩 جدول شگفت‌انگیز
            </h1>

            <h2 id="welcome"></h2>

        </header>



        <!-- ==================================================
             جدول ۴ × ۴
        =================================================== -->

        <section
            id="board"
            class="board"
            aria-label="جدول چهار در چهار">

        </section>



        <!-- ==================================================
             شکل‌های قابل انتخاب
        =================================================== -->

        <section
            class="pieces"
            aria-label="انتخاب شکل">


            <button
                class="piece"
                type="button"
                aria-label="سیب">

                🍎

            </button>


            <button
                class="piece"
                type="button"
                aria-label="گربه">

                🐱

            </button>


            <button
                class="piece"
                type="button"
                aria-label="ستاره">

                ⭐

            </button>


            <button
                class="piece"
                type="button"
                aria-label="ماشین">

                🚗

            </button>

        </section>



        <!-- ==================================================
             دکمه‌های بازی
        =================================================== -->

        <section
            class="buttons"
            aria-label="کنترل‌های بازی">


            <button
                id="check"
                type="button">

                ✅ بررسی پاسخ

            </button>


            <button
                id="newGame"
                type="button">

                🎲 جدول جدید

            </button>

        </section>



        <!-- پیام بازی -->

        <h2
            id="message"
            aria-live="polite">
        </h2>


    </main>



    <!-- ==================================================
         JavaScript
    =================================================== -->

    <script src="script.js"></script>

</body>

</html>
