
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>جدول شگفت انگیز 🧩</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         صفحه شروع
    ========================== -->

    <div class="welcome">

        <div class="card">

            <!-- عکس شما -->
            <img
                src="IMG_3330.jpeg"
                class="teacher"
                alt="معلم">

            <h1>🧩 جدول شگفت انگیز</h1>

            <p>
                بازی آموزشی کلاس اول دبستان
            </p>

            <h2>
                نام زیبایت را وارد کن 🥰
            </h2>

            <input
                id="studentName"
                type="text"
                placeholder="نام دانش‌آموز">

            <button id="startGame">
                🎮 شروع بازی
            </button>

        </div>

    </div>


    <!-- =========================
         صفحه بازی
    ========================== -->

    <div id="game">

        <div class="game-header">

            <h1>🧩 جدول شگفت انگیز</h1>

            <h2 id="welcome"></h2>

        </div>


        <!-- جدول سودوکو -->

        <div id="board" class="board"></div>


        <!-- شکل‌های بازی -->

        <div class="pieces">

            <button class="piece">🍎</button>

            <button class="piece">🐱</button>

            <button class="piece">⭐</button>

            <button class="piece">🚗</button>

        </div>


        <!-- دکمه‌ها -->

        <div class="buttons">

            <button id="check">
                ✅ بررسی پاسخ
            </button>

            <button id="newGame">
                🎲 جدول جدید
            </button>

        </div>


        <!-- پیام -->

        <h2 id="message"></h2>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
