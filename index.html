
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سودوکوی کلاس اول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>جدول شگفت انگیز 🧩</h1>
<div class="login">

    <h2>نام زیبایت را وارد کن 🥰</h2>

    <input
        type="text"
        id="studentName"
        placeholder=""
    >

    <br><br>

    <button id="startGame">
        🎮 شروع بازی
    </button>

</div>

<h2 id="welcome"></h2>

<div id="game" style="display:none;">

    <div id="board" class="board"></div>

    <!-- بقیه قسمت‌های بازی همینجا قرار می‌گیرند -->

</div>
    <!-- جدول سودوکو -->
    <div id="board" class="board"></div>

    <!-- شکل‌ها -->
    <div class="pieces">
        <button class="piece">🍎</button>
        <button class="piece">🐱</button>
        <button class="piece">⭐</button>
        <button class="piece">🚗</button>
    </div>

    <!-- دکمه‌ها -->
    <div class="buttons">
        <button id="check">✅ بررسی پاسخ</button>
        <button id="newGame">🎲 جدول جدید</button>
    </div>

    <h2 id="message"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
